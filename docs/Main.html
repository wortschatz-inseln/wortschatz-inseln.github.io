<!doctype html>
<html lang="de" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortschatz-Inseln">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/kiki.png">
<title>Inselkarte</title>
<link rel="stylesheet" href="app.css">
<style>body{background:#EEF7F9}

body{margin:0}
a{color:#0C7C74}a:hover{color:#075A54}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:none;cursor:pointer;text-decoration:none;font-family:'Fredoka',system-ui,sans-serif;font-weight:600;transition:transform .08s ease, box-shadow .08s ease}
.btn:active{transform:translateY(4px)}
.btn-teal{background:#0C7C74;color:#fff;box-shadow:0 6px 0 #075A54}
.btn-teal:hover{color:#fff}
.btn-sun{background:#FFC23D;color:#10304A;box-shadow:0 6px 0 #D99A12}
.btn-sun:hover{color:#10304A}
.btn-soft{background:#fff;color:#10304A;border:2px solid #C9DDE4;box-shadow:0 4px 0 #C9DDE4}
.btn-soft:hover{color:#10304A;border-color:#9AD3DF}
.island{transition:transform .15s ease}
.island:hover{transform:translateY(-4px)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:4px solid #10304A;outline-offset:4px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 6px rgba(255,194,61,.45)}50%{box-shadow:0 0 0 16px rgba(255,194,61,.2)}}
.today{animation:glow 2.4s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
.fog{animation:drift 6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.bob,.today,.fog{animation:none}}
</style>
<script>window.__GAPS=[{"cls":"btn","gap":12,"display":"flex"}];</script>
<script src="wsi.js"></script>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<script type="text/x-tpl" id="tpl">

<div style="width: 1194px; height: 834px; box-sizing: border-box; padding: 24px 32px; display: flex; flex-direction: column; gap: 20px; background: #EEF7F9; font-family: 'Nunito', system-ui, sans-serif; color: #10304A; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 24px; height: 88px">
    <div style="display: flex; align-items: center; gap: 18px">
      <div style="width: 84px; height: 84px; border-radius: 50%; background: #fff; border: 3px solid #C9DDE4; display: flex; align-items: flex-end; justify-content: center; box-sizing: border-box; overflow: hidden">
        <img src="assets/kiki.png" alt="" style="height: 76px; width: auto; display: block">
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 36px; line-height: 1.1">Ahoi, {{ name }}!</h1>
        <p style="margin: 0; font-size: 19px; color: #3E5A6E">Heute wartet der Verlängerungs-Vulkan auf dich.<sc-if value="{{ multi }}" hint-placeholder-val="{{ false }}"> · <a href="Start.html?w=1" style="font-weight: 800">Wechseln</a></sc-if></p>
      </div>
    </div>
    <nav aria-label="Bereiche" style="display: flex; align-items: center; gap: 16px">
      <div style="display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 20px; padding: 8px 18px 8px 10px; border: 2px solid #C9DDE4; height: 64px; box-sizing: border-box">
        <svg width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="3 von 4 Tagen geschafft"><circle cx="24" cy="24" r="19" fill="none" stroke="#D6E9EF" stroke-width="7"></circle><circle cx="24" cy="24" r="19" fill="none" stroke="#0C7C74" stroke-width="7" stroke-linecap="round" stroke-dasharray="89.5 119.4" transform="rotate(-90 24 24)"></circle></svg>
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 14px; font-weight: 700; color: #3E5A6E">Wochenziel</span>
          <span style="font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 20px">3 von 4 Tagen</span>
        </div>
      </div>
      <a class="btn btn-soft" href="Sammelbuch.html" style="height: 64px; padding: 0 20px; border-radius: 20px; font-size: 20px; box-sizing: border-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path><path d="M9 7h6"></path></svg>
        Sammelbuch
        <span style="background: #FFC23D; border-radius: 999px; padding: 2px 10px; font-size: 16px">24</span>
      </a>
      <a class="btn btn-soft" href="Eltern.html" style="height: 64px; padding: 0 18px; border-radius: 20px; font-size: 16px; box-sizing: border-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        Eltern
        <sc-if value="{{ backupDue }}" hint-placeholder-val="{{ false }}"><span aria-label="Sicherung fällig" style="background: #FFC23D; border-radius: 999px; padding: 2px 9px; font-size: 14px">Sicherung fällig</span></sc-if>
      </a>
    </nav>
  </header>

  <main style="position: relative; height: 522px; border-radius: 40px; border: 4px solid #fff; overflow: hidden; flex-shrink: 0; background: #0FBFC9; box-shadow: 0 8px 0 #9AD3DF">
    <img src="assets/karte.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">

    <div style="position: absolute; left: 25px; top: 380px; width: 210px; display: flex; justify-content: center">
      <div style="display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: 20px; padding: 8px 18px; box-shadow: 0 4px 0 rgba(16,48,74,.18)">
        <span style="display: flex; align-items: center; gap: 6px; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 19px"><span style="width: 24px; height: 24px; border-radius: 50%; background: #0C7C74; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Silben-Strand</span>
        <span style="font-size: 14px; color: #3E5A6E; font-weight: 700">Geschafft · 12 Schätze</span>
      </div>
    </div>

    <a class="island" href="EchoHoehle.html" aria-label="Verlängerungs-Vulkan: heutige Expedition starten" style="position: absolute; left: 318px; top: 6px; width: 250px; height: 300px; display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #10304A">
      <span class="today" style="width: 236px; height: 200px; border-radius: 50%; border: 5px solid #FFC23D; box-sizing: border-box; box-shadow: 0 0 0 8px rgba(255,194,61,.45)"></span>
      <span style="position: absolute; left: 6px; top: 14px; background: #10304A; color: #fff; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 17px; padding: 6px 14px; border-radius: 999px">Heute</span>
      <span style="display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: 20px; padding: 8px 18px; box-shadow: 0 4px 0 rgba(16,48,74,.18); margin-top: 10px">
        <span style="font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 21px">Verlängerungs-Vulkan</span>
        <span style="font-size: 14px; color: #3E5A6E; font-weight: 700">Hund oder Hunt? · 5 von 18 Schätzen</span>
      </span>
    </a>

    <div aria-hidden="true" class="fog" style="position: absolute; left: 640px; top: 28px; width: 250px; height: 196px; border-radius: 50%; background: rgba(255,255,255,.62); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)"></div>
    <div style="position: absolute; left: 665px; top: 104px; width: 200px; display: flex; justify-content: center">
      <div style="display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 20px; padding: 8px 16px; box-shadow: 0 4px 0 rgba(16,48,74,.18)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3E5A6E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span style="display: flex; flex-direction: column"><span style="font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 18px">Doppel-Bucht</span><span style="font-size: 13px; color: #3E5A6E; font-weight: 700">noch im Nebel</span></span></div>
    </div>

    <div aria-hidden="true" class="fog" style="position: absolute; left: 530px; top: 300px; width: 320px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.62); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)"></div>
    <div style="position: absolute; left: 590px; top: 386px; width: 200px; display: flex; justify-content: center">
      <div style="display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 20px; padding: 8px 16px; box-shadow: 0 4px 0 rgba(16,48,74,.18)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3E5A6E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span style="display: flex; flex-direction: column"><span style="font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 18px">ie-Lagune</span><span style="font-size: 13px; color: #3E5A6E; font-weight: 700">noch im Nebel</span></span></div>
    </div>

    <a class="island" href="Hafen.html" aria-label="Englisch-Hafen: Vokabeltrainer öffnen" style="position: absolute; left: 905px; top: 40px; width: 220px; height: 300px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-decoration: none; color: #10304A">
      <span style="display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: 20px; padding: 8px 18px; box-shadow: 0 4px 0 rgba(16,48,74,.18)">
        <span style="font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 18px">Englisch-Hafen</span>
        <span style="font-size: 14px; color: #3E5A6E; font-weight: 700">Vokabeln · 4 Themen geschafft</span>
      </span>
    </a>
  </main>

  <footer style="display: flex; align-items: center; gap: 24px; height: 120px">
    <div style="display: flex; align-items: center; gap: 14px; flex: 1">
      <div class="bob" style="flex-shrink: 0">
        <img src="assets/kiki.png" alt="" style="height: 118px; width: auto; display: block">
      </div>
      <div style="position: relative; background: #fff; border-radius: 24px; padding: 14px 20px; max-width: 400px; border: 2px solid #C9DDE4">
        <p style="margin: 0; font-size: 20px; line-height: 1.35"><strong style="font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600">Kiki:</strong> Im Vulkan verstecken sich fünf Wörter. Mit dem Trick <strong>Verlängern</strong> findest du sie alle!</p>
      </div>
    </div>
    <a class="btn btn-soft" href="Lernwoche.html" style="height: 92px; padding: 0 24px; border-radius: 28px; gap: 14px; box-sizing: border-box">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M8 11l2.5 2.5L16 9"></path></svg>
      <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><span style="font-size: 22px; line-height: 1">Lernwoche</span><span style="font-family: 'Nunito', system-ui, sans-serif; font-weight: 700; font-size: 14px">Wörter aus der Schule</span></span>
    </a>
    <a class="btn btn-sun" href="EchoHoehle.html" style="height: 92px; padding: 0 36px 0 40px; border-radius: 28px; gap: 20px">
      <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px">
        <span style="font-size: 30px; line-height: 1">Expedition starten</span>
        <span style="font-family: 'Nunito', system-ui, sans-serif; font-weight: 700; font-size: 16px">ca. 12 Minuten</span>
      </span>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </footer>
</div>
</script>
<script src="app.js"></script>
<script src="js/Main.js"></script>
<script src="boot.js"></script>
</body>
</html>
