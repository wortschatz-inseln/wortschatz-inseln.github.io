<!doctype html>
<html lang="de" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortschatz-Inseln">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/kiki.png">
<title>Lernwoche</title>
<link rel="stylesheet" href="app.css">
<style>body{background:#F2F6E9}

body{margin:0}
a{color:#0C7C74}a:hover{color:#075A54}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:none;cursor:pointer;text-decoration:none;font-family:'Fredoka',system-ui,sans-serif;font-weight:600;transition:transform .08s ease, box-shadow .08s ease}
.btn:active{transform:translateY(4px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-teal{background:#0C7C74;color:#fff;box-shadow:0 6px 0 #075A54}
.btn-teal:hover{color:#fff}
.btn-sun{background:#FFC23D;color:#10304A;box-shadow:0 6px 0 #D99A12}
.btn-sun:hover{color:#10304A}
.btn-soft{background:#fff;color:#10304A;border:2px solid #C9DDE4;box-shadow:0 4px 0 #C9DDE4}
.btn-soft:hover{color:#10304A;border-color:#9AD3DF}
.btn-on{background:#10304A;color:#fff;border:2px solid #10304A;box-shadow:0 4px 0 #071B2B}
.btn-red{background:#FDE7E5;color:#9B1C1C;border:3px solid #E5484D;box-shadow:0 4px 0 #C1272D}
.btn-red:hover{color:#9B1C1C}
.btn-blue{background:#E3EEFD;color:#1D4ED8;border:3px solid #3D8BEB;box-shadow:0 4px 0 #2F6FD0}
.btn-blue:hover{color:#1D4ED8}
.btn-green{background:#E5F4E4;color:#2E6B1F;border:3px solid #4CAF50;box-shadow:0 4px 0 #3A8A3E}
.btn-green:hover{color:#2E6B1F}
.btn-good{background:#E6F5F2;color:#075A54;border:3px solid #0C7C74;box-shadow:0 4px 0 #075A54}
.btn-bad{background:#FFF4D6;color:#8A4B08;border:3px solid #F08A24;box-shadow:0 4px 0 #D99A12}
.card{text-align:left;cursor:pointer;transition:transform .12s ease}
.card:hover{transform:translateY(-3px)}
.word-input{box-sizing:border-box;border:3px solid #C9DDE4;border-bottom:6px solid #9AD3DF;border-radius:22px;background:#F8FCFD;font-family:'Andika',system-ui,sans-serif;color:#10304A;text-align:center}
.word-input:focus{border-color:#0C7C74;outline:none}
.gap{width:22px;height:84px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.gap:hover span{background:#9AD3DF}
a:focus-visible,button:focus-visible{outline:4px solid #10304A;outline-offset:4px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out both}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}
</style>
<script>window.__GAPS=[{"cls":"btn","gap":10,"display":"flex"}];</script>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<script type="text/x-tpl" id="tpl">

<div style="width: 1194px; height: 834px; box-sizing: border-box; padding: 24px 32px; display: flex; flex-direction: column; gap: 18px; background: #F2F6E9; font-family: 'Nunito', system-ui, sans-serif; color: #10304A; overflow: hidden">

  <sc-if value="{{ isHub }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 18px; height: 100%">
      <header style="display: flex; align-items: center; gap: 20px">
        <a class="btn btn-soft" href="Main.html" style="height: 60px; padding: 0 20px; border-radius: 20px; font-size: 19px; box-sizing: border-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
          Karte
        </a>
        <img src="assets/kiki.png" alt="" style="height: 84px; width: auto">
        <div style="display: flex; flex-direction: column; flex: 1">
          <h1 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 38px; line-height: 1.1">Meine Lernwoche</h1>
          <p style="margin: 0; font-size: 18px; color: #3E5A6E">{{ weekSub }}</p>
        </div>
        <sc-if value="{{ chestReady }}" hint-placeholder-val="{{ false }}">
          <button class="btn btn-sun pop" type="button" onClick="{{ toTruhe }}" style="height: 60px; padding: 0 20px; border-radius: 20px; font-size: 19px">
            <img src="assets/truhe.png" alt="" style="height: 40px; width: auto">Truhe öffnen!
          </button>
        </sc-if>
        <sc-if value="{{ chestWait }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid #C9DDE4; border-radius: 20px; height: 60px; padding: 0 16px; box-sizing: border-box">
            <img src="assets/truhe.png" alt="" style="height: 40px; width: auto">
            <span style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-weight: 800; font-size: 15px">Truhe {{ chestNo }}: {{ inChest }} von 4</span>
              <span style="display: flex; gap: 6px">
                <sc-for list="{{ chestPips }}" as="p" hint-placeholder-count="4"><span style="width: 18px; height: 12px; border-radius: 6px; background: {{ p.bg }}; border: 2px solid #D99A12; box-sizing: border-box"></span></sc-for>
              </span>
            </span>
          </div>
        </sc-if>
        <button class="btn btn-soft" type="button" onClick="{{ toGate }}" aria-label="Für Eltern: Lernwörter eintragen" style="height: 60px; padding: 0 16px; border-radius: 20px; font-size: 16px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
          Eltern
        </button>
      </header>

      <section aria-label="Lernwörter der Woche" style="background: #fff; border-radius: 26px; padding: 16px 22px; box-shadow: 0 5px 0 #D6E2C4; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
          <h2 style="margin: 0; font-size: 16px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #5C7A2E">Lernwörter dieser Woche</h2>
          <span style="display: flex; align-items: center; gap: 10px"><span style="font-size: 15px; font-weight: 800; color: #8A4B08; background: #FFF4D6; border-radius: 999px; padding: 4px 12px">⭐ {{ stars }} · {{ rank }}</span><sc-if value="{{ hasShelf }}" hint-placeholder-val="{{ false }}"><span aria-label="Gesammelte Schätze" style="font-size: 22px">{{ shelf }}</span></sc-if><sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; font-weight: 800; color: #0C7C74; background: #E6F5F2; border-radius: 999px; padding: 4px 12px">{{ note }}</span></sc-if></span>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px">
          <sc-for list="{{ chips }}" as="c" hint-placeholder-count="10">
            <li style="font-family: 'Andika', system-ui, sans-serif; font-size: {{ c.size }}; background: #F2F6E9; border-radius: 14px; padding: 4px 14px">{{ c.w }}</li>
          </sc-for>
        </ul>
      </section>

      <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{ cards }}" as="k" hint-placeholder-count="6">
          <li style="display: flex">
            <button class="card" type="button" onClick="{{ k.open }}" style="flex: 1; height: 150px; box-sizing: border-box; border-radius: 24px; background: {{ k.bg }}; border: 3px solid {{ k.border }}; box-shadow: 0 5px 0 #D6E2C4; padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between; font-family: inherit; color: #10304A">
              <span style="display: flex; justify-content: space-between; align-items: center; width: 100%">
                <span style="font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 22px">{{ k.title }}</span>
                <span style="display: flex; align-items: center; gap: 5px"><sc-if value="{{ k.medal }}" hint-placeholder-val="{{ false }}"><img src="assets/medaille.png" alt="Meister-Medaille" style="height: 34px; width: auto"></sc-if><sc-for list="{{ k.pips }}" as="p" hint-placeholder-count="3"><span style="width: 16px; height: 16px; border-radius: 50%; background: {{ p.bg }}; border: 2px solid {{ p.bd }}; box-sizing: border-box"></span></sc-for></span>
              </span>
              <span style="font-size: 16px; line-height: 1.35; color: #3E5A6E; font-weight: 600">{{ k.desc }}</span>
              <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 14px; font-weight: 800; color: #5C7A2E">{{ k.next }}<sc-if value="{{ k.star }}" hint-placeholder-val="{{ false }}"><span style="background: #10304A; color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 13px">Wichtigste Aufgabe</span></sc-if></span>
            </button>
          </li>
        </sc-for>
        <li style="display: flex">
          <a class="card" href="KoerperEnglisch.html" style="flex: 1; height: 150px; box-sizing: border-box; border-radius: 24px; background: #E3F2FB; border: 3px solid #9CC6FF; box-shadow: 0 5px 0 #C9DDE4; padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; color: #10304A">
            <span style="font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 22px">My body</span>
            <span style="font-size: 16px; line-height: 1.35; color: #3E5A6E; font-weight: 600">Englische Körperteile zeigen und zuordnen</span>
            <span style="font-size: 14px; font-weight: 800; color: #2F6FD0">Englisch · 10 Wörter</span>
          </a>
        </li>
      </ul>
    </div>
  </sc-if>

  <sc-if value="{{ isTruhe }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 14px; height: 100%">
      <header style="display: flex; align-items: center; height: 64px">
        <button class="btn btn-soft" type="button" onClick="{{ toHub }}" style="height: 60px; padding: 0 20px; border-radius: 20px; font-size: 19px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
          Lernwoche
        </button>
      </header>
      <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
        <sc-if value="{{ truheClosed }}" hint-placeholder-val="{{ true }}">
          <h1 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 44px">Deine Schatztruhe wartet!</h1>
          <p style="margin: 0; font-size: 21px; color: #3E5A6E">Vier Übungen geschafft – das hast du dir verdient.</p>
          <img class="pop" src="assets/truhe.png" alt="" style="height: 260px; width: auto">
          <button class="btn btn-sun" type="button" onClick="{{ openIt }}" style="height: 84px; padding: 0 56px; border-radius: 28px; font-size: 30px">Truhe öffnen</button>
        </sc-if>
        <sc-if value="{{ truheOpen }}" hint-placeholder-val="{{ false }}">
          <h1 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 40px">Du hast gefunden:</h1>
          <img class="pop" src="assets/truhe_offen.png" alt="" style="height: 190px; width: auto">
          <span class="pop" style="font-size: 84px; line-height: 1.1">{{ rwEmoji }}</span>
          <h2 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 38px">{{ rwName }}</h2>
          <p style="margin: 0; font-size: 21px; color: #3E5A6E; max-width: 560px; line-height: 1.4">{{ rwText }}</p>
          <span style="font-family: 'Fredoka', system-ui, sans-serif; font-size: 26px; font-weight: 600; color: #8A4B08; background: #FFF4D6; border-radius: 18px; padding: 8px 22px">+3 ⭐ Bonus-Sterne</span>
          <button class="btn btn-teal" type="button" onClick="{{ closeTruhe }}" style="height: 76px; padding: 0 48px; border-radius: 26px; font-size: 26px">Weiter</button>
        </sc-if>
      </main>
    </div>
  </sc-if>

  <sc-if value="{{ isGate }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 18px; height: 100%">
      <header style="display: flex; align-items: center; height: 64px">
        <button class="btn btn-soft" type="button" onClick="{{ toHub }}" style="height: 60px; padding: 0 20px; border-radius: 20px; font-size: 19px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
          Lernwoche
        </button>
      </header>
      <main style="flex: 1; display: flex; align-items: center; justify-content: center">
        <section style="width: 480px; background: #fff; border-radius: 28px; padding: 40px; box-shadow: 0 5px 0 #D6E2C4; display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center">
          <h2 style="margin: 0; font-size: 26px; font-weight: 800">Für Eltern: Neue Lernwörter</h2>
          <label for="lwgate" style="font-size: 20px">Was ist 7 × 8?</label>
          <input id="lwgate" class="word-input" type="text" inputmode="numeric" autocomplete="off" value="{{ gateAns }}" onChange="{{ onGate }}" onKeyDown="{{ onGateKey }}" style="width: 180px; height: 72px; font-size: 34px">
          <sc-if value="{{ gateWrong }}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 16px; font-weight: 700; color: #B45309">Das stimmt nicht ganz – noch einmal.</span>
          </sc-if>
          <button class="btn btn-teal" type="button" onClick="{{ unlock }}" style="height: 60px; width: 220px; border-radius: 18px; font-size: 20px">Öffnen</button>
        </section>
      </main>
    </div>
  </sc-if>

  <sc-if value="{{ isEdit }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 16px; height: 100%; font-family: 'Nunito', system-ui, sans-serif">
      <header style="display: flex; align-items: center; gap: 18px; height: 60px">
        <button class="btn btn-soft" type="button" onClick="{{ toHub }}" style="height: 56px; padding: 0 18px; border-radius: 18px; font-size: 18px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
          Abbrechen
        </button>
        <h1 style="margin: 0; font-size: 28px; font-weight: 800; flex: 1">Lernwörter für die kommende Woche</h1>
        <button class="btn btn-soft" type="button" onClick="{{ loadCurrent }}" style="height: 48px; padding: 0 16px; border-radius: 14px; font-size: 15px">{{ edCurrentInfo }} · bearbeiten</button>
      </header>

      <main style="flex: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px">
        <section style="background: #fff; border-radius: 24px; padding: 20px 22px; box-shadow: 0 4px 0 #D6E2C4; display: flex; flex-direction: column; gap: 10px; min-height: 0">
          <div style="display: flex; gap: 10px">
            <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 800; color: #3E5A6E">Von<input type="date" value="{{ edFrom }}" onChange="{{ onFrom }}" style="height: 44px; border: 2px solid #C9DDE4; border-radius: 12px; padding: 0 8px; font-family: inherit; font-size: 16px; color: #10304A"></label>
            <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 800; color: #3E5A6E">Bis<input type="date" value="{{ edTo }}" onChange="{{ onTo }}" style="height: 44px; border: 2px solid #C9DDE4; border-radius: 12px; padding: 0 8px; font-family: inherit; font-size: 16px; color: #10304A"></label>
          </div>
          <label for="edtext" style="font-size: 15px; font-weight: 800">Lernwörter abtippen</label>
          <span style="font-size: 13px; color: #3E5A6E; line-height: 1.35">Ein Wort pro Zeile, Nomen gern mit Artikel. Mehrzahl optional: „der Hund, die Hunde“</span>
          <textarea id="edtext" spellcheck="false" autocapitalize="off" value="{{ edText }}" onChange="{{ onEdText }}" placeholder="die Angst&#10;streiten&#10;plötzlich&#10;der Urlaub, die Urlaube" style="height: 200px; box-sizing: border-box; border: 2px solid #C9DDE4; border-radius: 14px; padding: 10px 12px; font-family: 'Andika', system-ui, sans-serif; font-size: 19px; line-height: 1.4; color: #10304A; resize: none"></textarea>
          <button class="btn btn-sun" type="button" onClick="{{ analyze }}" disabled="{{ edTextEmpty }}" style="height: 52px; border-radius: 16px; font-size: 18px">Wörter übernehmen →</button>
          <label for="edsent" style="font-size: 15px; font-weight: 800; margin-top: 4px">Sätze für „Groß oder klein?“ <span style="font-weight: 600; color: #3E5A6E">(optional)</span></label>
          <textarea id="edsent" spellcheck="false" value="{{ edSent }}" onChange="{{ onEdSent }}" placeholder="Ein Satz pro Zeile. Leer lassen: Dann übt Elli mit ihren eigenen Sätzen aus der Satz-Werkstatt." style="flex: 1; min-height: 80px; box-sizing: border-box; border: 2px solid #C9DDE4; border-radius: 14px; padding: 10px 12px; font-family: 'Andika', system-ui, sans-serif; font-size: 17px; line-height: 1.4; color: #10304A; resize: none"></textarea>
        </section>

        <section style="background: #fff; border-radius: 24px; padding: 18px 22px; box-shadow: 0 4px 0 #D6E2C4; display: flex; flex-direction: column; gap: 10px; min-height: 0">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <h2 style="margin: 0; font-size: 20px; font-weight: 800">{{ edCount }}</h2>
            <span style="font-size: 13px; font-weight: 700; color: #8A4B08"><span style="display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: #FFE08A; vertical-align: -1px"></span> geraten – bitte kurz prüfen</span>
          </div>
          <div style="display: grid; grid-template-columns: 70px minmax(0, 1.3fr) 108px minmax(0, 1fr) minmax(0, 1fr) 40px; gap: 8px; font-size: 13px; font-weight: 800; color: #3E5A6E; padding: 0 6px">
            <span>Artikel</span><span>Wort</span><span>Wortart</span><span>Mehrzahl</span><span>Silben (mit -)</span><span></span>
          </div>
          <ul style="list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px">
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
              <li style="display: grid; grid-template-columns: 70px minmax(0, 1.3fr) 108px minmax(0, 1fr) minmax(0, 1fr) 40px; gap: 8px; align-items: center; background: {{ r.bg }}; border-radius: 12px; padding: 4px 6px">
                <button class="btn btn-soft" type="button" onClick="{{ r.cycleArt }}" disabled="{{ r.noArt }}" style="height: 42px; border-radius: 10px; font-size: 16px; box-shadow: none">{{ r.artLabel }}</button>
                <input type="text" spellcheck="false" autocapitalize="off" value="{{ r.w }}" onChange="{{ r.onW }}" style="height: 42px; min-width: 0; box-sizing: border-box; border: 2px solid #C9DDE4; border-radius: 10px; padding: 0 10px; font-family: 'Andika', system-ui, sans-serif; font-size: 19px; color: #10304A">
                <button class="btn {{ r.typCls }}" type="button" onClick="{{ r.cycleTyp }}" style="height: 42px; border-radius: 10px; font-size: 14px; box-shadow: none; padding: 0 4px">{{ r.typLabel }}</button>
                <input type="text" spellcheck="false" autocapitalize="off" value="{{ r.pl }}" onChange="{{ r.onPl }}" disabled="{{ r.noPl }}" placeholder="{{ r.plHint }}" style="height: 42px; min-width: 0; box-sizing: border-box; border: 2px solid #C9DDE4; border-radius: 10px; padding: 0 10px; font-family: 'Andika', system-ui, sans-serif; font-size: 18px; color: #10304A">
                <input type="text" spellcheck="false" autocapitalize="off" value="{{ r.syl }}" onChange="{{ r.onSyl }}" style="height: 42px; min-width: 0; box-sizing: border-box; border: 2px solid #C9DDE4; border-radius: 10px; padding: 0 10px; font-family: 'Andika', system-ui, sans-serif; font-size: 18px; color: #10304A">
                <button class="btn btn-soft" type="button" aria-label="{{ r.delLabel }}" onClick="{{ r.del }}" style="height: 42px; width: 40px; border-radius: 10px; box-shadow: none; padding: 0">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                </button>
              </li>
            </sc-for>
            <sc-if value="{{ noRows }}" hint-placeholder-val="{{ false }}">
              <li style="padding: 30px 10px; text-align: center; font-size: 17px; color: #3E5A6E">Links die Wörter abtippen und „Wörter übernehmen“ antippen. Wortart, Mehrzahl und Silben werden vorgeschlagen – du kannst alles ändern.</li>
            </sc-if>
          </ul>
          <div style="display: flex; align-items: center; gap: 12px; border-top: 2px solid #EEF3E4; padding-top: 12px">
            <button class="btn btn-soft" type="button" onClick="{{ addRow }}" style="height: 48px; padding: 0 16px; border-radius: 14px; font-size: 16px">+ Wort</button>
            <span aria-live="polite" style="flex: 1; font-size: 15px; font-weight: 800; color: {{ edMsgColor }}">{{ edMsg }}</span>
            <button class="btn btn-soft" type="button" onClick="{{ saveNow }}" style="height: 52px; padding: 0 18px; border-radius: 16px; font-size: 16px">Sofort starten</button>
            <button class="btn btn-teal" type="button" onClick="{{ savePlan }}" style="height: 52px; padding: 0 20px; border-radius: 16px; font-size: 17px">{{ planLabel }}</button>
          </div>
        </section>
      </main>
    </div>
  </sc-if>

  <sc-if value="{{ isExercise }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 18px; height: 100%">
      <header style="display: flex; align-items: center; justify-content: space-between; height: 64px">
        <button class="btn btn-soft" type="button" onClick="{{ toHub }}" style="height: 60px; padding: 0 20px; border-radius: 20px; font-size: 19px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
          Lernwoche
        </button>
        <ol aria-label="Fortschritt" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 10px">
          <sc-for list="{{ dots }}" as="d" hint-placeholder-count="6">
            <li style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; background: {{ d.fill }}; border: 3px solid {{ d.border }}"></li>
          </sc-for>
        </ol>
        <span style="font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 22px; min-width: 180px; text-align: right">{{ exTitle }}</span>
      </header>

      <main style="flex: 1; display: flex; justify-content: center">
        <section aria-live="polite" style="width: 860px; height: 660px; box-sizing: border-box; background: #fff; border-radius: 36px; padding: 32px 44px; box-shadow: 0 8px 0 #D6E2C4; display: flex; flex-direction: column; align-items: center; gap: 22px">

          <sc-if value="{{ roundBreak }}" hint-placeholder-val="{{ false }}">
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
              <img class="pop" src="assets/kiki.png" alt="" style="height: 170px; width: auto">
              <h2 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 42px">{{ breakTitle }}</h2>
              <p style="margin: 0; font-size: 21px; color: #3E5A6E; max-width: 600px; line-height: 1.45">{{ breakText }}</p>
              <button class="btn btn-sun" type="button" onClick="{{ startRound }}" style="height: 80px; padding: 0 44px; border-radius: 26px; font-size: 26px">{{ breakButton }}</button>
            </div>
          </sc-if>
          <sc-if value="{{ finished }}" hint-placeholder-val="{{ false }}">
            <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
              <img class="pop" src="assets/truhe.png" alt="" style="height: 170px; width: auto">
              <h2 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 44px">Geschafft!</h2>
              <p style="margin: 0; font-size: 21px; color: #3E5A6E; max-width: 520px; line-height: 1.4">{{ finishText }}</p>
              <sc-if value="{{ hasReward }}" hint-placeholder-val="{{ false }}"><p class="pop" style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 26px; color: #8A4B08; background: #FFF4D6; border-radius: 18px; padding: 10px 22px; max-width: 640px">{{ rewardText }}</p></sc-if>
              <sc-if value="{{ isSatz }}" hint-placeholder-val="{{ false }}">
                <ol style="margin: 0; padding: 0 0 0 28px; text-align: left; font-family: 'Andika', system-ui, sans-serif; font-size: 20px; line-height: 1.45; max-height: 200px; overflow: auto; width: 680px">
                  <sc-for list="{{ written }}" as="x" hint-placeholder-count="3"><li>{{ x.t }} <span style="font-family: 'Nunito', system-ui, sans-serif; font-size: 13px; font-weight: 800; color: #5C7A2E">{{ x.r }}</span></li></sc-for>
                </ol>
              </sc-if>
              <button class="btn btn-teal" type="button" onClick="{{ toHub }}" style="height: 76px; padding: 0 44px; border-radius: 26px; font-size: 26px">{{ finishBtn }}</button>
            </div>
          </sc-if>

          <sc-if value="{{ running }}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 22px; width: 100%">
              <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
                <h2 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 32px">{{ prompt }}</h2>
                <span style="font-size: 17px; color: #3E5A6E; font-weight: 700">{{ subPrompt }}</span>
              </div>

              <sc-if value="{{ isTask }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%">
                  <span style="font-size: 15px; font-weight: 800; color: #5C7A2E; background: #F2F6E9; border-radius: 999px; padding: 4px 14px">{{ roundLabel }}</span>
                  <sc-if value="{{ tHasShow }}" hint-placeholder-val="{{ false }}">
                    <span style="font-family: 'Andika', system-ui, sans-serif; font-size: {{ tSize }}; text-align: center; max-width: 760px; line-height: 1.3">{{ tShow }}</span>
                  </sc-if>
                  <sc-if value="{{ tHasSpeak }}" hint-placeholder-val="{{ false }}">
                    <button class="btn btn-soft" type="button" onClick="{{ tSpeakFn }}" style="height: 56px; padding: 0 20px; border-radius: 18px; font-size: 18px">Vorsprechen</button>
                  </sc-if>
                  <sc-if value="{{ tChoice }}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%">
                      <sc-for list="{{ tOptions }}" as="o" hint-placeholder-count="3">
                        <button class="btn {{ o.cls }}" type="button" disabled="{{ o.disabled }}" onClick="{{ o.pick }}" style="width: {{ o.w }}; min-height: 76px; padding: 8px 22px; border-radius: 20px; font-family: 'Andika', system-ui, sans-serif; font-weight: 400; font-size: {{ o.size }}">{{ o.l }}</button>
                      </sc-for>
                    </div>
                  </sc-if>
                  <sc-if value="{{ tType }}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
                      <input id="tin" class="word-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Hier schreiben" value="{{ input }}" onChange="{{ onInput }}" onKeyDown="{{ onKey }}" style="height: 88px; width: 520px; font-size: 46px">
                      <sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
                        <button class="btn btn-teal" type="button" disabled="{{ empty }}" onClick="{{ check }}" style="height: 76px; padding: 0 44px; border-radius: 26px; font-size: 26px">Prüfen</button>
                      </sc-if>
                    </div>
                  </sc-if>
                  <sc-if value="{{ tOrder }}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px">
                      <ol aria-label="Deine Reihenfolge" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; min-height: 80px; align-items: center">
                        <sc-for list="{{ tPicked }}" as="p" hint-placeholder-count="2">
                          <li style="background: #E6F5F2; border: 3px solid #0C7C74; border-radius: 18px; padding: 8px 16px; font-family: 'Andika', system-ui, sans-serif; font-size: 44px">{{ p.w }}</li>
                        </sc-for>
                      </ol>
                      <div style="display: flex; gap: 14px">
                        <sc-for list="{{ tLeft }}" as="a" hint-placeholder-count="3">
                          <button class="btn btn-soft" type="button" onClick="{{ a.pick }}" style="height: 84px; padding: 0 26px; border-radius: 22px; font-family: 'Andika', system-ui, sans-serif; font-weight: 400; font-size: 44px">{{ a.w }}</button>
                        </sc-for>
                      </div>
                    </div>
                  </sc-if>
                </div>
              </sc-if>

              <sc-if value="{{ isDiktat }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%">
                  <button class="btn btn-sun" type="button" onClick="{{ speak }}" style="height: 84px; padding: 0 30px; border-radius: 28px; font-size: 24px">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19.5 5.5a9 9 0 0 1 0 13"></path></svg>
                    Anhören
                  </button>
                  <sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
                    <div style="display: flex; gap: 16px; width: 100%">
                      <label for="dik" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Dein Wort</label>
                      <input id="dik" class="word-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Hier schreiben" value="{{ input }}" onChange="{{ onInput }}" onKeyDown="{{ onKey }}" style="height: 100px; font-size: 54px; flex: 1; min-width: 0">
                      <button class="btn btn-teal" type="button" disabled="{{ empty }}" onClick="{{ check }}" style="height: 100px; padding: 0 30px; border-radius: 26px; font-size: 26px">Prüfen</button>
                    </div>
                  </sc-if>
                  <sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
                      <sc-if value="{{ wasWrong }}" hint-placeholder-val="{{ false }}">
                        <span style="font-family: 'Andika', system-ui, sans-serif; font-size: 38px; color: #3E5A6E">Du: {{ attempt }}</span>
                      </sc-if>
                      <span style="display: flex; font-family: 'Andika', system-ui, sans-serif; font-size: 64px">
                        <sc-for list="{{ letters }}" as="l" hint-placeholder-count="5">
                          <span style="border-radius: 10px; padding: 0 2px; background: {{ l.bg }}">{{ l.ch }}</span>
                        </sc-for>
                      </span>
                    </div>
                  </sc-if>
                </div>
              </sc-if>

              <sc-if value="{{ isSatz }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%">
                  <span style="font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #5C7A2E">{{ roundLabel }}</span>
                  <div style="display: flex; align-items: center; gap: 14px">
                    <sc-if value="{{ wordShown }}" hint-placeholder-val="{{ true }}">
                      <span style="font-family: 'Andika', system-ui, sans-serif; font-weight: 700; font-size: 54px; background: #FFF4D6; border: 3px solid #FFC23D; border-radius: 22px; padding: 2px 22px">{{ satzWord }}</span>
                      <button class="btn btn-sun" type="button" aria-label="Lernwort anhören" onClick="{{ speak }}" style="width: 64px; height: 64px; border-radius: 20px">
                        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
                      </button>
                    </sc-if>
                    <sc-if value="{{ wordHidden }}" hint-placeholder-val="{{ false }}">
                      <button class="btn btn-sun" type="button" onClick="{{ speak }}" style="height: 76px; padding: 0 28px; border-radius: 24px; font-size: 24px">
                        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19.5 5.5a9 9 0 0 1 0 13"></path></svg>
                        Wort anhören
                      </button>
                      <button class="btn btn-soft" type="button" onClick="{{ speakSlowWord }}" style="height: 60px; padding: 0 18px; border-radius: 18px; font-size: 17px">Ganz langsam</button>
                    </sc-if>
                    <button class="btn btn-soft" type="button" onClick="{{ toggleIdea }}" style="height: 56px; padding: 0 18px; border-radius: 18px; font-size: 17px">Ideen-Hilfe</button>
                  </div>
                  <sc-if value="{{ showIdea }}" hint-placeholder-val="{{ false }}">
                    <span style="font-size: 19px; font-weight: 700; color: #5C7A2E">Kiki fragt: {{ idea }}</span>
                  </sc-if>
                  <label for="satz" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Dein Satz</label>
                  <textarea id="satz" class="word-input" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Schreib hier deinen Satz …" value="{{ input }}" onChange="{{ onSatz }}" disabled="{{ satzLocked }}" style="width: 100%; height: 120px; font-size: 34px; text-align: left; padding: 12px 18px; resize: none; line-height: 1.35"></textarea>
                  <sc-if value="{{ satzAsking }}" hint-placeholder-val="{{ true }}">
                    <div style="display: flex; gap: 14px">
                      <button class="btn btn-soft" type="button" disabled="{{ empty }}" onClick="{{ readBack }}" style="height: 64px; padding: 0 22px; border-radius: 20px; font-size: 19px">Vorlesen lassen</button>
                      <button class="btn btn-teal" type="button" disabled="{{ empty }}" onClick="{{ checkSatz }}" style="height: 64px; padding: 0 36px; border-radius: 20px; font-size: 22px">Prüfen</button>
                    </div>
                  </sc-if>
                  <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ false }}">
                    <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; width: 100%">
                      <sc-for list="{{ results }}" as="r" hint-placeholder-count="4">
                        <li style="display: flex; flex-direction: column; gap: 2px; background: {{ r.bg }}; border-radius: 14px; padding: 8px 12px">
                          <span style="font-size: 17px; font-weight: 800; color: {{ r.color }}">{{ r.mark }} {{ r.label }}</span>
                          <sc-if value="{{ r.showTip }}" hint-placeholder-val="{{ false }}"><span style="font-size: 15px; font-weight: 700; color: #3E5A6E">{{ r.tip }}</span></sc-if>
                        </li>
                      </sc-for>
                    </ul>
                  </sc-if>
                  <sc-if value="{{ hasMarks }}" hint-placeholder-val="{{ false }}">
                    <p aria-label="Dein Satz mit markierten Stolperstellen" style="margin: 0; display: flex; flex-wrap: wrap; gap: 6px; font-family: 'Andika', system-ui, sans-serif; font-size: 26px">
                      <sc-for list="{{ markedTokens }}" as="m" hint-placeholder-count="5"><span style="background: {{ m.bg }}; border-radius: 8px; padding: 0 4px">{{ m.t }}</span></sc-for>
                    </p>
                  </sc-if>
                  <sc-if value="{{ isSelf }}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; align-items: center; gap: 22px; flex-wrap: wrap; justify-content: center">
                      <label style="display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 800; cursor: pointer"><input type="checkbox" checked="{{ self2 }}" onChange="{{ toggleSelf2 }}" style="width: 30px; height: 30px; accent-color: #0C7C74">Satz vorgelesen – klingt richtig?</label>
                      <button class="btn btn-teal" type="button" disabled="{{ selfNotDone }}" onClick="{{ saveSatz }}" style="height: 64px; padding: 0 28px; border-radius: 20px; font-size: 21px">In die Schatzkiste</button>
                    </div>
                  </sc-if>
                </div>
              </sc-if>

              <sc-if value="{{ isSilben }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
                  <button class="btn btn-soft" type="button" onClick="{{ speakSlow }}" style="height: 56px; padding: 0 20px; border-radius: 18px; font-size: 18px">Langsam vorsprechen</button>
                  <div style="display: flex; align-items: center">
                    <sc-for list="{{ silLetters }}" as="l" hint-placeholder-count="6">
                      <span style="display: flex; align-items: center">
                        <span style="font-family: 'Andika', system-ui, sans-serif; font-size: 72px; line-height: 84px; width: 50px; text-align: center">{{ l.ch }}</span>
                        <sc-if value="{{ l.hasGap }}" hint-placeholder-val="{{ false }}">
                          <button class="gap" type="button" aria-label="Hier trennen" aria-pressed="{{ l.cut }}" onClick="{{ l.toggle }}"><span style="width: 6px; height: 70px; border-radius: 3px; background: {{ l.gapColor }}"></span></button>
                        </sc-if>
                      </span>
                    </sc-for>
                  </div>
                  <sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
                    <span style="font-family: 'Andika', system-ui, sans-serif; font-size: 40px; color: #0C7C74">{{ silSolution }}</span>
                  </sc-if>
                  <sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
                    <button class="btn btn-teal" type="button" onClick="{{ check }}" style="height: 76px; padding: 0 44px; border-radius: 26px; font-size: 26px">Prüfen</button>
                  </sc-if>
                </div>
              </sc-if>

              <sc-if value="{{ isPlural }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%">
                  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; width: 100%">
                    <div style="background: #F2F6E9; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 4px">
                      <span style="font-size: 16px; font-weight: 800; color: #5C7A2E">EINZAHL</span>
                      <span style="font-family: 'Andika', system-ui, sans-serif; font-size: 50px">{{ singular }}</span>
                    </div>
                    <div style="background: #F2F6E9; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 4px">
                      <span style="font-size: 16px; font-weight: 800; color: #5C7A2E">MEHRZAHL</span>
                      <sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
                        <span style="font-family: 'Andika', system-ui, sans-serif; font-size: 50px; color: #0C7C74">die {{ plural }}</span>
                      </sc-if>
                      <sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
                        <span style="display: flex; align-items: center; gap: 10px; font-family: 'Andika', system-ui, sans-serif; font-size: 50px">die
                          <label for="pl" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mehrzahl</label>
                          <input id="pl" class="word-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="{{ input }}" onChange="{{ onInput }}" onKeyDown="{{ onKey }}" style="height: 76px; width: 230px; font-size: 42px">
                        </span>
                      </sc-if>
                    </div>
                  </div>
                  <sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
                    <button class="btn btn-teal" type="button" disabled="{{ empty }}" onClick="{{ check }}" style="height: 76px; padding: 0 44px; border-radius: 26px; font-size: 26px">Prüfen</button>
                  </sc-if>
                </div>
              </sc-if>

              <sc-if value="{{ isWortart }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
                  <span style="font-family: 'Andika', system-ui, sans-serif; font-size: {{ shownSize }}; letter-spacing: .02em; text-align: center; max-width: 760px; line-height: 1.3">{{ shownWord }}</span>
                  <div role="group" aria-label="Wortart" style="display: flex; gap: 16px">
                    <sc-for list="{{ typeButtons }}" as="b" hint-placeholder-count="3">
                      <button class="btn {{ b.cls }}" type="button" disabled="{{ b.disabled }}" onClick="{{ b.pick }}" style="width: 180px; height: 96px; border-radius: 24px; flex-direction: column; gap: 2px">
                        <span style="font-size: 26px">{{ b.label }}</span>
                        <span style="font-family: 'Nunito', system-ui, sans-serif; font-size: 14px; font-weight: 700">{{ b.hint }}</span>
                      </button>
                    </sc-for>
                  </div>
                </div>
              </sc-if>

              <sc-if value="{{ isGross }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
                  <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 760px">
                    <sc-for list="{{ tokens }}" as="t" hint-placeholder-count="6">
                      <button class="btn {{ t.cls }}" type="button" aria-pressed="{{ t.on }}" onClick="{{ t.toggle }}" style="height: 76px; padding: 0 16px; border-radius: 18px; font-family: 'Andika', system-ui, sans-serif; font-weight: 400; font-size: 40px">{{ t.text }}</button>
                    </sc-for>
                  </div>
                  <sc-if value="{{ asking }}" hint-placeholder-val="{{ true }}">
                    <button class="btn btn-teal" type="button" onClick="{{ check }}" style="height: 76px; padding: 0 44px; border-radius: 26px; font-size: 26px">Prüfen</button>
                  </sc-if>
                </div>
              </sc-if>

              <sc-if value="{{ isAbc }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
                  <ol aria-label="Deine Reihenfolge" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 12px; min-height: 76px">
                    <sc-for list="{{ abcPicked }}" as="p" hint-placeholder-count="2">
                      <li style="display: flex; align-items: center; gap: 8px; background: #E6F5F2; border: 3px solid #0C7C74; border-radius: 18px; padding: 8px 16px; font-family: 'Andika', system-ui, sans-serif; font-size: 36px"><span style="font-family: 'Fredoka', system-ui, sans-serif; font-size: 20px; color: #0C7C74">{{ p.n }}.</span>{{ p.w }}</li>
                    </sc-for>
                  </ol>
                  <div style="display: flex; gap: 14px">
                    <sc-for list="{{ abcLeft }}" as="a" hint-placeholder-count="4">
                      <button class="btn btn-soft" type="button" onClick="{{ a.pick }}" style="height: 80px; padding: 0 24px; border-radius: 22px; font-family: 'Andika', system-ui, sans-serif; font-weight: 400; font-size: 38px">{{ a.w }}</button>
                    </sc-for>
                  </div>
                </div>
              </sc-if>

              <p style="margin: 0; min-height: 30px; font-size: 20px; font-weight: 800; text-align: center; color: {{ msgColor }}">{{ msg }}</p>
              <sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
                <button class="btn btn-teal" type="button" onClick="{{ next }}" style="height: 76px; padding: 0 56px; border-radius: 26px; font-size: 28px">Weiter</button>
              </sc-if>
            </div>
          </sc-if>
        </section>
      </main>
    </div>
  </sc-if>
</div>
</script>
<script src="app.js"></script>
<script src="js/Lernwoche.js"></script>
<script src="boot.js"></script>
</body>
</html>
