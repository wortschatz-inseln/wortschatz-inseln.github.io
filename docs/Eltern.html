<!doctype html>
<html lang="de" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortschatz-Inseln">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/kiki.png">
<title>Eltern-Bereich</title>
<link rel="stylesheet" href="app.css">
<style>body{background:#F4F7F9}

body{margin:0}
a{color:#0C7C74}a:hover{color:#075A54}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:none;cursor:pointer;text-decoration:none;font-family:'Nunito',system-ui,sans-serif;font-weight:800;transition:transform .08s ease, box-shadow .08s ease}
.btn:active{transform:translateY(3px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn-teal{background:#0C7C74;color:#fff;box-shadow:0 4px 0 #075A54}
.btn-teal:hover{color:#fff}
.btn-soft{background:#fff;color:#10304A;border:2px solid #C9DDE4;box-shadow:0 3px 0 #C9DDE4}
.btn-soft:hover{color:#10304A}
.seg-on{background:#10304A;color:#fff;border:2px solid #10304A;box-shadow:none}
.opt-on{border:3px solid #0C7C74;background:#E6F5F2}
.opt-off{border:3px solid #C9DDE4;background:#fff}
.field{box-sizing:border-box;border:2px solid #C9DDE4;border-radius:14px;background:#fff;font-family:'Nunito',system-ui,sans-serif;color:#10304A}
.field:focus{border-color:#0C7C74;outline:none}
a:focus-visible,button:focus-visible{outline:3px solid #10304A;outline-offset:3px}
</style>
<script>window.__GAPS=[{"cls":"btn","gap":10,"display":"flex"}];</script>
<script src="wsi.js"></script>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<script type="text/x-tpl" id="tpl">

<div style="width: 1194px; height: 834px; box-sizing: border-box; padding: 24px 32px 28px; display: flex; flex-direction: column; gap: 18px; background: #F4F7F9; font-family: 'Nunito', system-ui, sans-serif; color: #10304A; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; height: 56px">
    <div style="display: flex; align-items: center; gap: 18px">
      <sc-if value="{{ showBack }}" hint-placeholder-val="{{ true }}">
        <a class="btn btn-soft" href="Start.html" style="height: 52px; padding: 0 18px; border-radius: 14px; font-size: 16px; box-sizing: border-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
          Zurück zur App
        </a>
      </sc-if>
      <h1 style="margin: 0; font-size: 28px; font-weight: 800">{{ title }}</h1>
    </div>
  </header>

  <sc-if value="{{ isGate }}" hint-placeholder-val="{{ true }}">
    <main style="flex: 1; display: flex; align-items: center; justify-content: center">
      <section style="width: 480px; background: #fff; border-radius: 28px; padding: 40px; box-shadow: 0 4px 0 #D5E2E8; display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center">
        <div style="width: 72px; height: 72px; border-radius: 50%; background: #E4F1F5; display: flex; align-items: center; justify-content: center">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#10304A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        </div>
        <h2 style="margin: 0; font-size: 24px; font-weight: 800">{{ gateTitle }}</h2>
        <label for="gate" style="font-size: 20px">{{ gateLabel }}</label>
        <input id="gate" class="field" type="{{ gateType }}" inputmode="numeric" autocomplete="off" value="{{ answer }}" onChange="{{ onAnswer }}" onKeyDown="{{ onGateKey }}" style="width: 220px; height: 64px; font-size: 30px; text-align: center; font-weight: 800">
        <sc-if value="{{ gateWrong }}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 16px; font-weight: 700; color: #B45309">Das stimmt nicht – noch einmal.</span>
        </sc-if>
        <button class="btn btn-teal" type="button" onClick="{{ unlock }}" style="height: 56px; width: 220px; border-radius: 16px; font-size: 18px">Öffnen</button>
      </section>
    </main>
  </sc-if>

  <sc-if value="{{ isSetup }}" hint-placeholder-val="{{ false }}">
    <main style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <ol aria-label="Einrichtung" style="list-style: none; margin: 0; padding: 0; display: flex; gap: 10px">
        <sc-for list="{{ stepDots }}" as="d" hint-placeholder-count="4"><li style="width: 54px; height: 10px; border-radius: 5px; background: {{ d.bg }}"></li></sc-for>
      </ol>

      <sc-if value="{{ st1 }}" hint-placeholder-val="{{ true }}">
        <section style="width: 760px; background: #fff; border-radius: 28px; padding: 32px 40px; box-shadow: 0 4px 0 #D5E2E8; display: flex; flex-direction: column; gap: 16px">
          <h2 style="margin: 0; font-size: 28px; font-weight: 800">Willkommen bei den Wortschatz-Inseln</h2>
          <p style="margin: 0; font-size: 18px; line-height: 1.5; color: #3E5A6E">Alles, was ihr hier übt, bleibt auf diesem Gerät. Es gibt kein Konto und keinen Server. Richtet zuerst kurz alles ein – das dauert zwei Minuten.</p>
          <h3 style="margin: 8px 0 0; font-size: 20px; font-weight: 800">1 · Eltern-Code festlegen</h3>
          <p style="margin: 0; font-size: 16px; color: #3E5A6E">Mit diesem Code öffnet nur ihr den Eltern-Bereich. Vier bis sechs Ziffern.</p>
          <input id="pin" class="field" type="password" inputmode="numeric" autocomplete="off" placeholder="Code" value="{{ pinA }}" onChange="{{ onPinA }}" style="width: 220px; height: 60px; font-size: 28px; text-align: center; font-weight: 800">
          <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}"><span style="font-size: 16px; font-weight: 700; color: #B45309">{{ msg }}</span></sc-if>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px">
            <button class="btn btn-soft" type="button" onClick="{{ toRestore }}" style="height: 52px; padding: 0 20px; border-radius: 14px; font-size: 16px">Ich habe eine Sicherung</button>
            <button class="btn btn-teal" type="button" onClick="{{ next1 }}" style="height: 56px; padding: 0 32px; border-radius: 16px; font-size: 18px">Weiter</button>
          </div>
        </section>
      </sc-if>

      <sc-if value="{{ stRestore }}" hint-placeholder-val="{{ false }}">
        <section style="width: 760px; background: #fff; border-radius: 28px; padding: 32px 40px; box-shadow: 0 4px 0 #D5E2E8; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 26px; font-weight: 800">Sicherung einspielen</h2>
          <p style="margin: 0; font-size: 16px; color: #3E5A6E">Füge den gesamten Sicherungs-Text hier ein.</p>
          <textarea class="field" spellcheck="false" value="{{ restoreText }}" onChange="{{ onRestore }}" style="height: 220px; padding: 12px 14px; font-size: 14px; font-family: monospace"></textarea>
          <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}"><span style="font-size: 16px; font-weight: 700; color: #B45309">{{ msg }}</span></sc-if>
          <div style="display: flex; justify-content: space-between">
            <button class="btn btn-soft" type="button" onClick="{{ backToSetup }}" style="height: 52px; padding: 0 20px; border-radius: 14px; font-size: 16px">Zurück</button>
            <button class="btn btn-teal" type="button" onClick="{{ doRestoreSetup }}" style="height: 56px; padding: 0 28px; border-radius: 16px; font-size: 18px">Einspielen</button>
          </div>
        </section>
      </sc-if>

      <sc-if value="{{ st2 }}" hint-placeholder-val="{{ false }}">
        <section style="width: 760px; background: #fff; border-radius: 28px; padding: 32px 40px; box-shadow: 0 4px 0 #D5E2E8; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 26px; font-weight: 800">2 · Wer lernt auf diesem Gerät?</h2>
          <p style="margin: 0; font-size: 16px; color: #3E5A6E">Jedes Kind bekommt seinen eigenen Fortschritt. Du kannst später weitere Kinder hinzufügen.</p>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px">
            <sc-for list="{{ setupNames }}" as="n" hint-placeholder-count="2">
              <li><button class="btn btn-soft" type="button" onClick="{{ n.remove }}" aria-label="{{ n.aria }}" style="height: 48px; padding: 0 18px; border-radius: 999px; font-size: 18px">{{ n.name }} ✕</button></li>
            </sc-for>
          </ul>
          <div style="display: flex; gap: 12px">
            <input id="kid" class="field" type="text" autocomplete="off" placeholder="Vorname des Kindes" value="{{ newName }}" onChange="{{ onNewName }}" onKeyDown="{{ onNewKey }}" style="flex: 1; min-width: 0; height: 56px; padding: 0 16px; font-size: 20px">
            <button class="btn btn-teal" type="button" onClick="{{ addSetupName }}" style="height: 56px; padding: 0 24px; border-radius: 14px; font-size: 17px">Hinzufügen</button>
          </div>
          <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}"><span style="font-size: 16px; font-weight: 700; color: #B45309">{{ msg }}</span></sc-if>
          <div style="display: flex; justify-content: space-between; margin-top: 6px">
            <button class="btn btn-soft" type="button" onClick="{{ backTo1 }}" style="height: 52px; padding: 0 20px; border-radius: 14px; font-size: 16px">Zurück</button>
            <button class="btn btn-teal" type="button" onClick="{{ next2 }}" style="height: 56px; padding: 0 32px; border-radius: 16px; font-size: 18px">Weiter</button>
          </div>
        </section>
      </sc-if>

      <sc-if value="{{ st3 }}" hint-placeholder-val="{{ false }}">
        <section style="width: 860px; background: #fff; border-radius: 28px; padding: 32px 40px; box-shadow: 0 4px 0 #D5E2E8; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 26px; font-weight: 800">3 · Woher kommen die Lernwochen?</h2>
          <p style="margin: 0; font-size: 16px; color: #3E5A6E">Das lässt sich später im Eltern-Bereich jederzeit ändern.</p>
          <div style="display: flex; gap: 16px">
            <button class="{{ modeOwnCls }}" type="button" onClick="{{ pickOwn }}" style="flex: 1; text-align: left; border-radius: 22px; padding: 18px 20px; font-family: inherit; color: #10304A; cursor: pointer; display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 20px; font-weight: 800">Selber verwalten <span style="font-size: 13px; background: #0C7C74; color: #fff; border-radius: 999px; padding: 2px 10px; margin-left: 6px">empfohlen</span></span>
              <span style="font-size: 16px; line-height: 1.45; color: #3E5A6E">Ihr tragt die Lernwörter eurer Schule selbst ein. Sie passen genau zu eurem Kind und bleiben nur auf diesem Gerät.</span>
            </button>
            <button class="{{ modeAppCls }}" type="button" onClick="{{ pickApp }}" style="flex: 1; text-align: left; border-radius: 22px; padding: 18px 20px; font-family: inherit; color: #10304A; cursor: pointer; display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 20px; font-weight: 800">Lernwoche aus der App</span>
              <span style="font-size: 16px; line-height: 1.45; color: #3E5A6E">Die App bringt eine fertige Lernwoche mit (Klasse 3, NRW). Ihr müsst nichts eintragen.</span>
            </button>
          </div>
          <div style="display: flex; justify-content: space-between; margin-top: 6px">
            <button class="btn btn-soft" type="button" onClick="{{ backTo2 }}" style="height: 52px; padding: 0 20px; border-radius: 14px; font-size: 16px">Zurück</button>
            <button class="btn btn-teal" type="button" onClick="{{ next3 }}" style="height: 56px; padding: 0 32px; border-radius: 16px; font-size: 18px">Weiter</button>
          </div>
        </section>
      </sc-if>

      <sc-if value="{{ st4 }}" hint-placeholder-val="{{ false }}">
        <section style="width: 760px; background: #fff; border-radius: 28px; padding: 32px 40px; box-shadow: 0 4px 0 #D5E2E8; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 28px; font-weight: 800">Fertig eingerichtet</h2>
          <ul style="margin: 0; padding-left: 22px; font-size: 18px; line-height: 1.6">
            <li>Kinder: {{ sumNames }}</li>
            <li>Lernwochen: {{ sumMode }}</li>
            <li>Eltern-Code: {{ sumPin }}</li>
          </ul>
          <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3E5A6E; background: #FFF4D6; border-radius: 14px; padding: 12px 16px">Tipp: Erstellt ab und zu eine Sicherung (Eltern-Bereich → Sicherung). Wenn die Browserdaten gelöscht werden, ist der Fortschritt sonst weg. Die App erinnert euch alle zwei Wochen.</p>
          <button class="btn btn-teal" type="button" onClick="{{ finish }}" style="height: 60px; border-radius: 16px; font-size: 20px; align-self: flex-end; padding: 0 36px">Los geht's</button>
        </section>
      </sc-if>
    </main>
  </sc-if>

  <sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}">
    <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; min-height: 0">
      <sc-if value="{{ backupDue }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #FFF4D6; border: 2px solid #FFC23D; border-radius: 18px; padding: 12px 20px">
          <span style="font-size: 17px; font-weight: 800">Zeit für eine Sicherung – sie dauert eine Minute.</span>
          <button class="btn btn-teal" type="button" onClick="{{ goBackup }}" style="height: 44px; padding: 0 20px; border-radius: 12px; font-size: 15px">Jetzt sichern</button>
        </div>
      </sc-if>
      <nav aria-label="Bereiche" style="display: flex; gap: 10px">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
          <button class="btn {{ t.cls }}" type="button" onClick="{{ t.pick }}" aria-pressed="{{ t.on }}" style="height: 52px; padding: 0 22px; border-radius: 999px; font-size: 17px">{{ t.label }}</button>
        </sc-for>
      </nav>

      <sc-if value="{{ tabLern }}" hint-placeholder-val="{{ true }}">
        <section style="background: #fff; border-radius: 24px; padding: 24px 28px; box-shadow: 0 4px 0 #D5E2E8; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
          <h2 style="margin: 0; font-size: 21px; font-weight: 800">Woher kommen die Lernwochen auf diesem Gerät?</h2>
          <div style="display: flex; gap: 16px">
            <button class="{{ modeOwnCls }}" type="button" onClick="{{ pickOwn }}" style="flex: 1; text-align: left; border-radius: 20px; padding: 14px 18px; font-family: inherit; color: #10304A; cursor: pointer; display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 18px; font-weight: 800">Selber verwalten <span style="font-size: 12px; background: #0C7C74; color: #fff; border-radius: 999px; padding: 2px 9px; margin-left: 6px">empfohlen</span></span>
              <span style="font-size: 15px; line-height: 1.4; color: #3E5A6E">Ihr tragt die Lernwörter selbst ein.</span>
            </button>
            <button class="{{ modeAppCls }}" type="button" onClick="{{ pickApp }}" style="flex: 1; text-align: left; border-radius: 20px; padding: 14px 18px; font-family: inherit; color: #10304A; cursor: pointer; display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 18px; font-weight: 800">Lernwoche aus der App</span>
              <span style="font-size: 15px; line-height: 1.4; color: #3E5A6E">Neue Wochen kommen mit App-Updates. Eigene Lernwörter könnt ihr trotzdem hinzufügen – sie liegen im Lernregal.</span>
            </button>
          </div>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
            <sc-for list="{{ kidRows }}" as="r" hint-placeholder-count="2">
              <li style="display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #F4F7F9; border-radius: 16px; padding: 12px 18px">
                <span style="display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 19px; font-weight: 800">{{ r.name }}</span>
                  <span style="font-size: 15px; color: #3E5A6E">Jetzt: {{ r.cur }} · Nächste: {{ r.nxt }} · Eigene Pakete: {{ r.own }}</span>
                </span>
                <sc-if value="{{ r.canEdit }}" hint-placeholder-val="{{ true }}">
                  <button class="btn btn-teal" type="button" onClick="{{ r.edit }}" style="height: 48px; padding: 0 20px; border-radius: 14px; font-size: 16px">{{ r.editLabel }}</button>
                </sc-if>
                <sc-if value="{{ r.isApp }}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 15px; font-weight: 700; color: #3E5A6E">kommt aus der App</span>
                </sc-if>
              </li>
            </sc-for>
          </ul>
        </section>
      </sc-if>

      <sc-if value="{{ tabKids }}" hint-placeholder-val="{{ false }}">
        <section style="background: #fff; border-radius: 24px; padding: 24px 28px; box-shadow: 0 4px 0 #D5E2E8; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 21px; font-weight: 800">Kinder auf diesem Gerät</h2>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
            <sc-for list="{{ kidList }}" as="k" hint-placeholder-count="2">
              <li style="display: flex; align-items: center; gap: 12px">
                <input class="field" type="text" autocomplete="off" value="{{ k.name }}" onChange="{{ k.rename }}" aria-label="Name" style="flex: 1; min-width: 0; height: 52px; padding: 0 16px; font-size: 19px; font-weight: 800">
                <button class="btn btn-soft" type="button" onClick="{{ k.del }}" style="height: 52px; padding: 0 18px; border-radius: 14px; font-size: 16px; color: {{ k.delColor }}">{{ k.delLabel }}</button>
              </li>
            </sc-for>
          </ul>
          <div style="display: flex; gap: 12px">
            <input class="field" type="text" autocomplete="off" placeholder="Neues Kind: Vorname" value="{{ newName }}" onChange="{{ onNewName }}" onKeyDown="{{ onHomeNewKey }}" style="flex: 1; min-width: 0; height: 52px; padding: 0 16px; font-size: 19px">
            <button class="btn btn-teal" type="button" onClick="{{ addKid }}" style="height: 52px; padding: 0 22px; border-radius: 14px; font-size: 16px">Hinzufügen</button>
          </div>
          <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}"><span style="font-size: 16px; font-weight: 700; color: #0C7C74">{{ msg }}</span></sc-if>
        </section>
      </sc-if>

      <sc-if value="{{ tabBackup }}" hint-placeholder-val="{{ false }}">
        <section style="background: #fff; border-radius: 24px; padding: 24px 28px; box-shadow: 0 4px 0 #D5E2E8; display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-size: 21px; font-weight: 800">Sicherung</h2>
          <p style="margin: 0; font-size: 16px; color: #3E5A6E">{{ backupInfo }}</p>
          <div style="display: flex; gap: 12px; align-items: center">
            <button class="btn btn-teal" type="button" onClick="{{ makeBackup }}" style="height: 48px; padding: 0 20px; border-radius: 14px; font-size: 16px">Sicherung erstellen</button>
            <sc-if value="{{ hasExport }}" hint-placeholder-val="{{ false }}">
              <button class="btn btn-soft" type="button" onClick="{{ selectAll }}" style="height: 48px; padding: 0 18px; border-radius: 14px; font-size: 16px">Alles markieren</button>
              <a class="btn btn-soft" href="{{ mailHref }}" style="height: 48px; padding: 0 18px; border-radius: 14px; font-size: 16px; box-sizing: border-box">Per E-Mail senden</a>
            </sc-if>
          </div>
          <sc-if value="{{ hasExport }}" hint-placeholder-val="{{ false }}">
            <textarea id="bk" class="field" spellcheck="false" readonly value="{{ exportText }}" style="height: 110px; padding: 10px 12px; font-size: 12px; font-family: monospace"></textarea>
            <span style="font-size: 14px; color: #3E5A6E">Markieren, kopieren und irgendwo sicher ablegen (Notizen, E-Mail an dich selbst).</span>
          </sc-if>
          <h3 style="margin: 8px 0 0; font-size: 18px; font-weight: 800">Sicherung einspielen</h3>
          <textarea class="field" spellcheck="false" placeholder="Sicherungs-Text hier einfügen" value="{{ restoreText }}" onChange="{{ onRestore }}" style="height: 90px; padding: 10px 12px; font-size: 12px; font-family: monospace"></textarea>
          <div style="display: flex; align-items: center; gap: 14px">
            <button class="btn btn-soft" type="button" onClick="{{ doRestoreHome }}" style="height: 48px; padding: 0 20px; border-radius: 14px; font-size: 16px">Einspielen (ersetzt alles auf diesem Gerät)</button>
            <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}"><span style="font-size: 16px; font-weight: 700; color: #0C7C74">{{ msg }}</span></sc-if>
          </div>
        </section>
      </sc-if>

      <sc-if value="{{ tabCode }}" hint-placeholder-val="{{ false }}">
        <section style="background: #fff; border-radius: 24px; padding: 24px 28px; box-shadow: 0 4px 0 #D5E2E8; display: flex; flex-direction: column; gap: 14px">
          <h2 style="margin: 0; font-size: 21px; font-weight: 800">Eltern-Code</h2>
          <p style="margin: 0; font-size: 16px; color: #3E5A6E">{{ pinState }}</p>
          <div style="display: flex; gap: 12px">
            <input class="field" type="password" inputmode="numeric" autocomplete="off" placeholder="Neuer Code (4–6 Ziffern)" value="{{ pinA }}" onChange="{{ onPinA }}" style="width: 280px; height: 52px; padding: 0 16px; font-size: 19px">
            <button class="btn btn-teal" type="button" onClick="{{ setPin }}" style="height: 52px; padding: 0 22px; border-radius: 14px; font-size: 16px">Code speichern</button>
          </div>
          <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}"><span style="font-size: 16px; font-weight: 700; color: #0C7C74">{{ msg }}</span></sc-if>
        </section>
      </sc-if>
    </main>
  </sc-if>
</div>
</script>
<script src="app.js"></script>
<script src="js/Eltern.js"></script>
<script src="boot.js"></script>
</body>
</html>
