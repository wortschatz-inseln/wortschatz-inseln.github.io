<!doctype html>
<html lang="de" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortschatz-Inseln">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/kiki.png">
<title>Logbuch</title>
<link rel="stylesheet" href="app.css">
<style>body{background:#EEF7F9}

body{margin:0}
a{color:#0C7C74}a:hover{color:#075A54}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:none;cursor:pointer;text-decoration:none;font-family:'Fredoka',system-ui,sans-serif;font-weight:600;transition:transform .08s ease, box-shadow .08s ease}
.btn:active{transform:translateY(4px)}
.btn-teal{background:#0C7C74;color:#fff;box-shadow:0 6px 0 #075A54}
.btn-teal:hover{color:#fff}
.btn-soft{background:#fff;color:#10304A;border:2px solid #C9DDE4;box-shadow:0 4px 0 #C9DDE4}
.btn-picked{background:#FFC23D;color:#10304A;border:2px solid #D99A12;box-shadow:0 4px 0 #D99A12}
a:focus-visible,button:focus-visible{outline:4px solid #10304A;outline-offset:4px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .5s ease-out both}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}
</style>
<script>window.__GAPS=[{"cls":"btn","gap":12,"display":"flex"}];</script>
<script src="wsi.js"></script>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<script type="text/x-tpl" id="tpl">

<div style="width: 1194px; height: 834px; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 28px; background: #EEF7F9; font-family: 'Nunito', system-ui, sans-serif; color: #10304A; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 24px">
    <img class="pop" src="assets/truhe.png" alt="" style="height: 120px; width: auto; display: block; flex-shrink: 0">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #0C7C74">Logbuch · Verlängerungs-Vulkan</span>
      <h1 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 48px; line-height: 1.05">Expedition geschafft!</h1>
    </div>
  </header>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; flex: 1">
    <section style="background: #fff; border-radius: 32px; padding: 28px 32px; box-shadow: 0 6px 0 #C9DDE4; display: flex; flex-direction: column; gap: 16px">
      <h2 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 26px">Heute gefunden: 4 Schätze</h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <li style="display: flex; align-items: center; justify-content: space-between; background: #EEF7F9; border-radius: 18px; padding: 10px 18px">
          <span style="font-family: 'Andika', system-ui, sans-serif; font-size: 34px">Hund</span>
          <span style="display: flex; align-items: center; gap: 8px; font-weight: 800; color: #0C7C74; font-size: 17px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Schatz</span>
        </li>
        <li style="display: flex; align-items: center; justify-content: space-between; background: #FFF4D6; border-radius: 18px; padding: 10px 18px">
          <span style="font-family: 'Andika', system-ui, sans-serif; font-size: 34px">kommen</span>
          <span style="display: flex; align-items: center; gap: 8px; font-weight: 800; color: #8A4B08; font-size: 17px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3l8 8-3 3-8-8z"></path><path d="M11.5 9.5L3 18l3 3 8.5-8.5"></path></svg>Geschmiedet · kommt morgen wieder</span>
        </li>
        <li style="display: flex; align-items: center; justify-content: space-between; background: #EEF7F9; border-radius: 18px; padding: 10px 18px">
          <span style="font-family: 'Andika', system-ui, sans-serif; font-size: 34px">Vater</span>
          <span style="display: flex; align-items: center; gap: 8px; font-weight: 800; color: #0C7C74; font-size: 17px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Schatz</span>
        </li>
        <li style="display: flex; align-items: center; justify-content: space-between; background: #EEF7F9; border-radius: 18px; padding: 10px 18px">
          <span style="font-family: 'Andika', system-ui, sans-serif; font-size: 34px">Biene</span>
          <span style="display: flex; align-items: center; gap: 8px; font-weight: 800; color: #0C7C74; font-size: 17px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Schatz</span>
        </li>
        <li style="display: flex; align-items: center; justify-content: space-between; background: #EEF7F9; border-radius: 18px; padding: 10px 18px">
          <span style="font-family: 'Andika', system-ui, sans-serif; font-size: 34px">Wald</span>
          <span style="display: flex; align-items: center; gap: 8px; font-weight: 800; color: #0C7C74; font-size: 17px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Schatz · Sammelkarte!</span>
        </li>
      </ul>
    </section>

    <div style="display: flex; flex-direction: column; gap: 24px">
      <section style="background: #10304A; color: #fff; border-radius: 32px; padding: 28px 32px; display: flex; flex-direction: column; gap: 12px">
        <span style="font-weight: 800; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: #FFC23D">Dein Trick des Tages</span>
        <h2 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 34px">Verlängern</h2>
        <div style="display: flex; align-items: center; gap: 16px; font-family: 'Andika', system-ui, sans-serif; font-size: 40px">
          <span>Hund</span>
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFC23D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          <span>Hun-<span style="background: #FFC23D; color: #10304A; border-radius: 10px; padding: 0 6px">d</span>e</span>
        </div>
        <p style="margin: 0; font-size: 19px; line-height: 1.4; color: #D8E6EE">Du hast zweimal verlängert, bevor du geschrieben hast. Genau so machen das Profis.</p>
      </section>

      <section style="background: #fff; border-radius: 32px; padding: 26px 32px; box-shadow: 0 6px 0 #C9DDE4; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 24px">Wie war es heute?</h2>
        <div role="group" aria-label="Wie schwer war es?" style="display: flex; gap: 12px">
          <button class="btn {{ c1 }}" type="button" aria-pressed="{{ p1 }}" onClick="{{ pick1 }}" style="height: 64px; flex: 1; border-radius: 20px; font-size: 19px">Zu leicht</button>
          <button class="btn {{ c2 }}" type="button" aria-pressed="{{ p2 }}" onClick="{{ pick2 }}" style="height: 64px; flex: 1; border-radius: 20px; font-size: 19px">Genau richtig</button>
          <button class="btn {{ c3 }}" type="button" aria-pressed="{{ p3 }}" onClick="{{ pick3 }}" style="height: 64px; flex: 1; border-radius: 20px; font-size: 19px">Zu schwer</button>
        </div>
        <p aria-live="polite" style="margin: 0; font-size: 17px; font-weight: 700; color: #3E5A6E; min-height: 24px">{{ thanks }}</p>
      </section>
    </div>
  </div>

  <footer style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <div style="display: flex; align-items: center; gap: 14px">
      <img src="assets/kiki.png" alt="" style="height: 96px; width: auto; display: block">
      <svg width="56" height="56" viewBox="0 0 48 48" role="img" aria-label="Wochenziel geschafft: 4 von 4 Tagen"><circle cx="24" cy="24" r="19" fill="none" stroke="#0C7C74" stroke-width="7"></circle><path d="M16 24.5l5.5 5.5L32 19" fill="none" stroke="#0C7C74" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <p style="margin: 0; font-size: 20px; line-height: 1.35"><strong>Wochenziel geschafft!</strong> Für heute bist du fertig – bis morgen, {{ name }}!</p>
    </div>
    <a class="btn btn-teal" href="Main.html" style="height: 84px; padding: 0 40px; border-radius: 26px; font-size: 28px">Zurück zur Karte</a>
  </footer>
</div>
</script>
<script src="app.js"></script>
<script src="js/Logbuch.js"></script>
<script src="boot.js"></script>
</body>
</html>
