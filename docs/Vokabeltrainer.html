<!doctype html>
<html lang="de" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortschatz-Inseln">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/kiki.png">
<title>Vokabeltrainer Englisch</title>
<link rel="stylesheet" href="app.css">
<style>body{background:#E3F2FB}

body{margin:0}
a{color:#0C7C74}a:hover{color:#075A54}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:none;cursor:pointer;text-decoration:none;font-family:'Fredoka',system-ui,sans-serif;font-weight:600;transition:transform .08s ease, box-shadow .08s ease}
.btn:active{transform:translateY(4px)}
.btn[disabled]{cursor:not-allowed;transform:none}
.btn-teal{background:#0C7C74;color:#fff;box-shadow:0 6px 0 #075A54}
.btn-teal:hover{color:#fff}
.btn-sun{background:#FFC23D;color:#10304A;box-shadow:0 6px 0 #D99A12}
.btn-sun:hover{color:#10304A}
.btn-soft{background:#fff;color:#10304A;border:2px solid #C9DDE4;box-shadow:0 4px 0 #C9DDE4}
.btn-soft:hover{color:#10304A;border-color:#9AD3DF}
.pick{background:#fff;border:3px solid #C9DDE4;box-shadow:0 5px 0 #C9DDE4;border-radius:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s ease}
.pick:hover{border-color:#3D8BEB}
.pick:active{transform:translateY(3px)}
.pick-tried{opacity:.35;cursor:not-allowed}
.pick-right{border-color:#0C7C74;box-shadow:0 5px 0 #075A54;background:#E6F5F2}
.tile{width:76px;height:84px;border-radius:20px;background:#fff;border:3px solid #C9DDE4;box-shadow:0 5px 0 #C9DDE4;font-family:'Andika',system-ui,sans-serif;font-size:44px;color:#10304A;cursor:pointer}
.tile:active{transform:translateY(3px)}
.tile-used{visibility:hidden}
a:focus-visible,button:focus-visible{outline:4px solid #10304A;outline-offset:4px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out both}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bob{animation:bob 3s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pop,.bob{animation:none}}
</style>
<script>window.__GAPS=[{"cls":"btn","gap":12,"display":"flex"}];</script>
</head>

                </button>
              </sc-for>
            </div>
          </sc-if>

                  <sc-for list="{{ slots }}" as="s" hint-placeholder-count="3">
                    <span style="width: 68px; height: 84px; border-bottom: 5px solid #9AD3DF; display: flex; align-items: center; justify-content: center; font-family: 'Andika', system-ui, sans-serif; font-size: 58px; color: {{ s.color }}">{{ s.ch }}</span>
                  </sc-for>

              <div style="display: flex; gap: 16px">
                <sc-for list="{{ words }}" as="w" hint-placeholder-count="3">
                  <button class="btn btn-soft {{ w.cls }}" type="button" disabled="{{ w.disabled }}" onClick="{{ w.pick }}" style="height: 76px; padding: 0 30px; border-radius: 24px; font-family: 'Andika', system-ui, sans-serif; font-weight: 700; font-size: 36px">{{ w.text }}</button>
                </sc-for>
              </div>
            </div>
          </sc-if>

          <p style="margin: 0; min-height: 28px; font-size: 20px; font-weight: 800; color: {{ msgColor }}">{{ msg }}</p>

          <sc-if value="{{ solved }}" hint-placeholder-val="{{ false }}">
            <button class="btn btn-teal" type="button" onClick="{{ next }}" style="height: 76px; padding: 0 56px; border-radius: 26px; font-size: 28px">Weiter</button>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center">
          <img class="pop" src="assets/truhe.png" alt="" style="height: 180px; width: auto">
          <h2 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 44px">Ladung komplett!</h2>
          <p style="margin: 0; font-size: 21px; line-height: 1.4; color: #3E5A6E; max-width: 540px">Du hast heute <strong>dog, cat, fish, bird, frog</strong> und <strong>bee</strong> an Bord gebracht. Morgen fragt der Kapitän sie noch einmal ab.</p>
          <div style="display: flex; gap: 16px">
            <a class="btn btn-teal" href="Hafen.html" style="height: 76px; padding: 0 36px; border-radius: 26px; font-size: 26px">Zurück zum Hafen</a>
            <a class="btn btn-soft" href="Main.html" style="height: 76px; padding: 0 30px; border-radius: 26px; font-size: 22px">Zur Karte</a>
          </div>
        </div>
      </sc-if>
    </section>
  </main>

  <aside style="position: absolute; left: 24px; bottom: 36px; width: 150px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <div style="background: #fff; border: 2px solid #C9DDE4; border-radius: 20px; padding: 12px 14px; font-size: 17px; font-weight: 700; line-height: 1.3; text-align: center">{{ kiki }}</div>
    <img class="bob" src="assets/kiki.png" alt="" style="height: 130px; width: auto; display: block">
  </aside>
</div>
</script>
<script src="app.js"></script>
<script src="js/Vokabeltrainer.js"></script>
<script src="boot.js"></script>
</body>
</html>
