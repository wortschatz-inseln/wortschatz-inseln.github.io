<!doctype html>
<html lang="de" manifest="app.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortschatz-Inseln">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/kiki.png">
<title>Mathe-Inseln</title>
<link rel="stylesheet" href="app.css">
<style>body{background:#FFF4E0}

body{margin:0}
a{color:#0C7C74}a:hover{color:#075A54}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:none;cursor:pointer;text-decoration:none;font-family:'Fredoka',system-ui,sans-serif;font-weight:600;transition:transform .08s ease, box-shadow .08s ease}
.btn:active{transform:translateY(4px)}
.btn[disabled]{cursor:default;transform:none}
.btn-teal{background:#0C7C74;color:#fff;box-shadow:0 6px 0 #075A54}
.btn-teal:hover{color:#fff}
.btn-sun{background:#FFC23D;color:#10304A;box-shadow:0 6px 0 #D99A12}
.btn-sun:hover{color:#10304A}
.btn-soft{background:#fff;color:#10304A;border:2px solid #C9DDE4;box-shadow:0 4px 0 #C9DDE4}
.btn-soft:hover{color:#10304A;border-color:#9AD3DF}
.btn-on{background:#10304A;color:#fff;border:2px solid #10304A;box-shadow:0 4px 0 #071B2B}
.btn-good{background:#E6F5F2;color:#075A54;border:3px solid #0C7C74;box-shadow:none}
.btn-red{background:#FDE7E5;color:#9B1C1C;border:3px solid #E5484D;box-shadow:none}
.card{cursor:pointer;font-family:inherit;color:#10304A}
.card:active{transform:translateY(3px)}
a:focus-visible,button:focus-visible{outline:4px solid #10304A;outline-offset:3px}
</style>
<script>window.__GAPS=[{"cls":"btn","gap":10,"display":"flex"}];</script>
<script src="wsi.js"></script>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<script type="text/x-tpl" id="tpl">

<div style="width: 1194px; height: 834px; box-sizing: border-box; padding: 20px 28px; display: flex; flex-direction: column; gap: 14px; background: #FFF4E0; font-family: 'Nunito', system-ui, sans-serif; color: #10304A; overflow: hidden">

  <sc-if value="{{ isHub }}" hint-placeholder-val="{{ true }}">
    <header style="display: flex; align-items: center; gap: 18px; height: 64px; flex: none">
      <a class="btn btn-soft" href="Main.html" style="height: 56px; padding: 0 18px; border-radius: 18px; font-size: 18px; box-sizing: border-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
        Zurück
      </a>
      <div style="display: flex; flex-direction: column; flex: 1">
        <h1 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 32px; line-height: 1.1">Mathe-Inseln</h1>
        <p style="margin: 0; font-size: 16px; color: #3E5A6E">Wähle ein Thema. Pro Runde 8 Aufgaben – bis zu 3 Sterne.</p>
      </div>
      <span style="font-weight: 800; font-size: 17px; color: #3E5A6E">{{ starTotal }} ★</span>
      <div role="group" aria-label="Klasse wählen" style="display: flex; gap: 8px">
        <button class="btn {{ c3 }}" type="button" onClick="{{ setK3 }}" style="height: 52px; padding: 0 22px; border-radius: 999px; font-size: 19px">Klasse 3</button>
        <button class="btn {{ c4 }}" type="button" onClick="{{ setK4 }}" style="height: 52px; padding: 0 22px; border-radius: 999px; font-size: 19px">Klasse 4</button>
      </div>
    </header>
    <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
        <section style="width: 563px; box-sizing: border-box; background: {{ g.bg }}; border: 3px solid {{ g.bd }}; border-radius: 24px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="font-size: 30px; line-height: 34px">{{ g.ic }}</span>
            <span style="font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 21px">{{ g.title }}</span>
            <span style="font-size: 14px; color: #3E5A6E; font-weight: 700">{{ g.sub }}</span>
          </div>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px">
            <sc-for list="{{ g.cards }}" as="k" hint-placeholder-count="4">
              <li style="width: 168px; display: flex">
                <button class="card" type="button" onClick="{{ k.open }}" style="flex: 1; height: 120px; box-sizing: border-box; border-radius: 20px; background: #fff; border: 3px solid {{ g.bd }}; box-shadow: 0 4px 0 {{ g.bd }}; padding: 6px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center">
                  <span style="font-size: 30px; line-height: 34px">{{ k.ic }}</span>
                  <span style="font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 17px; line-height: 1.1">{{ k.title }}</span>
                  <span style="font-size: 12px; color: #3E5A6E; font-weight: 700; line-height: 1.15">{{ k.sub }}</span>
                  <span style="font-size: 18px; letter-spacing: 2px; color: #E8A400">{{ k.stars }}</span>
                </button>
              </li>
            </sc-for>
          </ul>
        </section>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isPlay }}" hint-placeholder-val="{{ false }}">
    <header style="display: flex; align-items: center; gap: 18px; height: 64px; flex: none">
      <button class="btn btn-soft" type="button" onClick="{{ toHub }}" style="height: 56px; padding: 0 18px; border-radius: 18px; font-size: 18px; box-sizing: border-box">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
        Themen
      </button>
      <div style="display: flex; flex-direction: column; flex: 1">
        <h1 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 30px; line-height: 1.1">{{ topicIc }} {{ topicTitle }}</h1>
        <p style="margin: 0; font-size: 16px; color: #3E5A6E">Klasse {{ klasse }} · Aufgabe {{ num }} von 8</p>
      </div>
      <div style="display: flex; gap: 6px" aria-hidden="true">
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="8">
          <span style="width: 20px; height: 20px; border-radius: 50%; background: {{ d.bg }}; border: 3px solid {{ d.bd }}; box-sizing: border-box"></span>
        </sc-for>
      </div>
    </header>
    <main style="flex: 1; display: flex; gap: 20px; min-height: 0">
      <section aria-live="polite" style="flex: 1; min-width: 0; background: #fff; border-radius: 32px; box-shadow: 0 8px 0 #E8D9BC; padding: 24px 32px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
        <span style="font-weight: 800; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #C47A00">{{ kind }}</span>
        <p style="margin: 0; font-family: 'Andika', system-ui, sans-serif; font-weight: 700; font-size: {{ qSize }}; line-height: 1.3; text-align: center; max-width: 640px">{{ q }}</p>
        <sc-if value="{{ hasImg }}" hint-placeholder-val="{{ false }}">
          <img src="{{ img }}" alt="" style="height: {{ imgH }}px; width: auto; max-width: 600px">
        </sc-if>
        <sc-if value="{{ isNum }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; min-height: 76px">
            <div style="min-width: 240px; height: 76px; box-sizing: border-box; padding: 0 22px; border-radius: 20px; border: 4px solid {{ boxBd }}; background: {{ boxBg }}; display: flex; align-items: center; justify-content: center; font-family: 'Andika', system-ui, sans-serif; font-weight: 700; font-size: 42px">{{ shown }}<span style="font-size: 26px; color: #3E5A6E; margin-left: 10px">{{ unit }}</span></div>
          </div>
        </sc-if>
        <sc-if value="{{ isChoice }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 640px">
            <sc-for list="{{ opts }}" as="o" hint-placeholder-count="4">
              <button class="btn {{ o.cls }}" type="button" onClick="{{ o.pick }}" style="min-width: 150px; height: 72px; padding: 0 22px; border-radius: 22px; font-family: 'Andika', system-ui, sans-serif; font-weight: 700; font-size: 28px; box-sizing: border-box">{{ o.t }}</button>
            </sc-for>
          </div>
        </sc-if>
        <p style="margin: 0; min-height: 54px; font-size: 20px; font-weight: 800; text-align: center; color: {{ msgColor }}; max-width: 620px; line-height: 1.3">{{ msg }}</p>
        <sc-if value="{{ answered }}" hint-placeholder-val="{{ false }}">
          <button class="btn btn-teal" type="button" onClick="{{ next }}" style="height: 66px; padding: 0 52px; border-radius: 24px; font-size: 26px">{{ nextLabel }}</button>
        </sc-if>
      </section>
      <sc-if value="{{ isNum }}" hint-placeholder-val="{{ true }}">
        <section aria-label="Zahlenfeld" style="width: 330px; flex: none; background: #F3E6C9; border-radius: 28px; padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; align-self: flex-start">
          <sc-for list="{{ padRows }}" as="row" hint-placeholder-count="5">
            <div style="display: flex; gap: 10px">
              <sc-for list="{{ row.keys }}" as="k" hint-placeholder-count="3">
                <button type="button" onClick="{{ k.press }}" style="flex: 1; height: 84px; min-width: 0; padding: 0; border-radius: 18px; border: none; border-bottom: 6px solid {{ k.edge }}; background: {{ k.bg }}; color: {{ k.fg }}; font-family: 'Andika', system-ui, sans-serif; font-size: {{ k.size }}; font-weight: 700; cursor: pointer">{{ k.l }}</button>
              </sc-for>
            </div>
          </sc-for>
        </section>
      </sc-if>
    </main>
  </sc-if>

  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <main style="flex: 1; display: flex; align-items: center; justify-content: center">
      <section style="width: 760px; background: #fff; border-radius: 36px; box-shadow: 0 8px 0 #E8D9BC; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
        <span style="font-size: 64px; letter-spacing: 8px; color: #E8A400">{{ doneStars }}</span>
        <h2 style="margin: 0; font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; font-size: 40px">{{ doneTitle }}</h2>
        <p style="margin: 0; font-size: 22px; color: #3E5A6E">{{ right }} von 8 Aufgaben gleich beim ersten Versuch richtig.</p>
        <p style="margin: 0; font-size: 18px; color: #3E5A6E; min-height: 26px">{{ doneNote }}</p>
        <div style="display: flex; gap: 14px; margin-top: 8px">
          <button class="btn btn-teal" type="button" onClick="{{ again }}" style="height: 72px; padding: 0 36px; border-radius: 24px; font-size: 24px">Noch eine Runde</button>
          <button class="btn btn-soft" type="button" onClick="{{ toHub }}" style="height: 72px; padding: 0 36px; border-radius: 24px; font-size: 24px; box-sizing: border-box">Andere Themen</button>
        </div>
      </section>
    </main>
  </sc-if>
</div>
</script>
<script src="app.js"></script>
<script src="js/Mathe.js"></script>
<script src="boot.js"></script>
</body>
</html>
